[package]
name = "tokenlab"
version = "1.0.7"
edition = "2021"
description = "TokenLab - local AI coding agent token usage tracker (Rust port)"
license = "MIT"
default-run = "tokenlab"

[lib]
name = "tokenlab"
path = "src/lib.rs"

[[bin]]
name = "tokenlab"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
dirs = "7.0.0"
fancy-regex = "0.20.2"
flate2 = "1.1.11"
futures = "0.3.34"
glob = "0.3.4"
hex = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
mime_guess = "2.0.5"
once_cell = "1.21.4"
parking_lot = "0.13.0"
regex = "1.13.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
rust-embed = "8.14.0"
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip", "raw_value"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tower-http = { version = "0.7.1", features = ["fs", "cors", "trace", "compression-gzip"] }
walkdir = "2.5.1"
zip = "9.8.1"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
